<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fahxd_Core - AI Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    :root {
      --bg: #080a0f;
      --panel: rgba(13, 16, 24, 0.82);
      --panel-strong: rgba(18, 22, 32, 0.92);
      --line: rgba(255, 255, 255, 0.09);
      --line-strong: rgba(255, 255, 255, 0.15);
      --text: #f7f8fb;
      --muted: #9aa4b8;
      --muted-2: #6f7a90;
      --purple: #8b7cf7;
      --cyan: #20d0bf;
      --green: #4ade80;
      --amber: #f6c453;
      --rose: #ff6b7a;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
      --radius: 8px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: "Inter", sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    #three-container {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: #080a0f;
    }

    .scene-vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(8, 10, 15, 0.98) 0%, rgba(8, 10, 15, 0.66) 28%, rgba(8, 10, 15, 0.36) 60%, rgba(8, 10, 15, 0.78) 100%),
        linear-gradient(180deg, rgba(8, 10, 15, 0.78) 0%, rgba(8, 10, 15, 0.18) 38%, rgba(8, 10, 15, 0.94) 100%);
    }

    .app-shell {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 292px minmax(0, 1fr);
      height: 100vh;
      min-height: 0;
    }

    .sidebar {
      position: relative;
      z-index: 4;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      padding: 14px;
      background: rgba(8, 10, 15, 0.9);
      border-right: 1px solid var(--line);
      backdrop-filter: blur(18px) saturate(150%);
      transition: width 0.2s ease, padding 0.2s ease, transform 0.22s ease;
    }

    body.sidebar-collapsed .app-shell {
      grid-template-columns: 0 minmax(0, 1fr);
    }

    body.sidebar-collapsed .sidebar {
      width: 0;
      padding-inline: 0;
      overflow: hidden;
      border-right-color: transparent;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 44px;
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 10px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      background: linear-gradient(135deg, var(--purple), var(--cyan));
      box-shadow: 0 12px 28px rgba(32, 208, 191, 0.18);
      color: white;
    }

    .brand-copy {
      display: flex;
      flex-direction: column;
      min-width: 0;
      gap: 2px;
    }

    .brand-copy strong {
      font-size: 0.96rem;
      line-height: 1.1;
      color: #ffffff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .brand-copy span {
      color: var(--muted);
      font-size: 0.72rem;
      line-height: 1.1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #d6dbea;
      flex: 0 0 auto;
      transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease, transform 0.18s ease;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: var(--line);
      color: #ffffff;
    }

    .icon-btn:active {
      transform: scale(0.97);
    }

    .icon-btn:disabled {
      opacity: 0.42;
      cursor: not-allowed;
      transform: none;
    }

    .primary-action {
      width: 100%;
      min-height: 42px;
      border: 1px solid rgba(32, 208, 191, 0.24);
      border-radius: 8px;
      background: rgba(32, 208, 191, 0.1);
      color: #efffff;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      padding: 0 12px;
      cursor: pointer;
      font-weight: 650;
      font-size: 0.86rem;
      transition: background 0.18s ease, border-color 0.18s ease;
    }

    .primary-action:hover {
      background: rgba(32, 208, 191, 0.15);
      border-color: rgba(32, 208, 191, 0.38);
    }

    .sidebar-section {
      margin-top: 18px;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .section-label {
      color: var(--muted-2);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 0 6px 8px;
    }

    .history-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-right: 2px;
      min-height: 0;
    }

    .history-item,
    .empty-history {
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: #ccd4e8;
      min-height: 42px;
      padding: 9px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease;
    }

    .history-item:hover,
    .history-item.active {
      background: rgba(255, 255, 255, 0.07);
      border-color: var(--line);
      color: #ffffff;
    }

    .history-item i,
    .empty-history i {
      color: var(--muted-2);
      width: 18px;
      text-align: center;
      flex: 0 0 auto;
    }

    .history-text {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .history-text strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.83rem;
      font-weight: 650;
    }

    .history-text span {
      color: var(--muted-2);
      font-size: 0.7rem;
    }

    .empty-history {
      cursor: default;
      color: var(--muted-2);
    }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      display: grid;
      gap: 8px;
    }

    .utility-btn {
      min-height: 38px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: #cbd3e5;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      padding: 0 10px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      text-align: left;
      transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease;
    }

    .utility-btn:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: var(--line);
      color: #ffffff;
    }

    .main-view {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: 64px minmax(0, 1fr) auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-width: 0;
      gap: 14px;
      padding: 10px 18px;
      background: rgba(8, 10, 15, 0.7);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(16px) saturate(150%);
    }

    .topbar-left,
    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .thread-title {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .thread-title strong {
      font-size: 0.96rem;
      line-height: 1.15;
      color: #ffffff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .thread-title span {
      color: var(--muted);
      font-size: 0.72rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      border: 1px solid rgba(74, 222, 128, 0.2);
      border-radius: 999px;
      background: rgba(74, 222, 128, 0.08);
      color: #dfffea;
      padding: 0 12px;
      font-size: 0.78rem;
      font-weight: 650;
      white-space: nowrap;
    }

    .status-pill.error {
      border-color: rgba(255, 107, 122, 0.28);
      background: rgba(255, 107, 122, 0.1);
      color: #ffd9de;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--green);
      box-shadow: 0 0 14px rgba(74, 222, 128, 0.7);
    }

    .status-pill.error .status-dot {
      background: var(--rose);
      box-shadow: 0 0 14px rgba(255, 107, 122, 0.6);
    }

    .chat-stage {
      min-height: 0;
      display: flex;
      justify-content: center;
      overflow: hidden;
      padding: 18px 18px 10px;
    }

    .chat-panel {
      width: min(100%, 860px);
      min-height: 0;
      overflow-y: auto;
      scroll-behavior: smooth;
      padding: 16px 4px 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      gap: 12px;
      width: 100%;
      animation: fadeIn 0.24s ease;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--line);
      flex: 0 0 auto;
    }

    .message.user .avatar {
      background: rgba(32, 208, 191, 0.12);
      border-color: rgba(32, 208, 191, 0.22);
      color: #bbfff6;
    }

    .message.ai .avatar {
      background: rgba(139, 124, 247, 0.13);
      border-color: rgba(139, 124, 247, 0.28);
      color: #e2ddff;
    }

    .message.error .avatar {
      background: rgba(255, 107, 122, 0.12);
      border-color: rgba(255, 107, 122, 0.28);
      color: #ffd9de;
    }

    .message-body {
      min-width: 0;
      max-width: 760px;
      color: #eef2fb;
      line-height: 1.62;
      font-size: 0.94rem;
      padding-top: 4px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .message.user .message-body {
      color: #ffffff;
    }

    .message.ai .message-body {
      color: #e8edf8;
    }

    .message.error .message-body {
      color: #ffd9de;
    }

    .message-body strong {
      color: #ffffff;
      font-weight: 750;
    }

    .message-body code {
      padding: 2px 5px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--line);
      color: #dbfffb;
      font-size: 0.88em;
    }

    .typing-indicator {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 22px;
    }

    .typing-indicator span {
      width: 6px;
      height: 6px;
      background: var(--cyan);
      border-radius: 50%;
      animation: typing 1.2s infinite;
    }

    .typing-indicator span:nth-child(2) {
      animation-delay: 0.16s;
    }

    .typing-indicator span:nth-child(3) {
      animation-delay: 0.32s;
    }

    .composer-wrap {
      display: flex;
      justify-content: center;
      padding: 10px 18px 20px;
      background: linear-gradient(180deg, rgba(8, 10, 15, 0), rgba(8, 10, 15, 0.9) 38%, rgba(8, 10, 15, 0.98));
    }

    .composer {
      width: min(100%, 860px);
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: rgba(16, 19, 28, 0.88);
      backdrop-filter: blur(16px) saturate(150%);
      box-shadow: var(--shadow);
      padding: 10px;
      display: grid;
      gap: 10px;
    }

    .composer-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .composer input {
      min-width: 0;
      flex: 1;
      min-height: 42px;
      border: 0;
      outline: none;
      background: transparent;
      color: #ffffff;
      font-size: 0.98rem;
      padding: 0 4px;
    }

    .composer input::placeholder {
      color: #77839a;
    }

    .composer-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      color: var(--muted-2);
      font-size: 0.72rem;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 8px;
    }

    .send-btn {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 8px;
      color: #07100f;
      background: linear-gradient(135deg, #f7fbff, #20d0bf);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex: 0 0 auto;
      box-shadow: 0 14px 30px rgba(32, 208, 191, 0.22);
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .send-btn:hover {
      transform: translateY(-1px);
    }

    .send-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .voice-btn.active {
      color: #dbfffb;
      background: rgba(32, 208, 191, 0.12);
      border-color: rgba(32, 208, 191, 0.25);
    }

    .mic-btn.recording {
      color: #ffffff;
      background: rgba(255, 107, 122, 0.16);
      border-color: rgba(255, 107, 122, 0.36);
      animation: micPulse 1.3s infinite;
    }

    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 3;
      background: rgba(0, 0, 0, 0.44);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .sidebar-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    @keyframes typing {
      0%,
      70%,
      100% {
        opacity: 0.35;
        transform: translateY(0);
      }

      35% {
        opacity: 1;
        transform: translateY(-5px);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes micPulse {
      0% {
        box-shadow: 0 0 0 0 rgba(255, 107, 122, 0.5);
      }

      70% {
        box-shadow: 0 0 0 12px rgba(255, 107, 122, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(255, 107, 122, 0);
      }
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.14);
      border-radius: 999px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.23);
    }

    @media (max-width: 860px) {
      .app-shell {
        grid-template-columns: minmax(0, 1fr);
      }

      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: min(88vw, 320px);
        transform: translateX(-105%);
        box-shadow: 28px 0 70px rgba(0, 0, 0, 0.42);
      }

      body.sidebar-open .sidebar {
        transform: translateX(0);
      }

      body.sidebar-collapsed .app-shell {
        grid-template-columns: minmax(0, 1fr);
      }

      body.sidebar-collapsed .sidebar {
        width: min(88vw, 320px);
        padding: 14px;
        border-right-color: var(--line);
      }

      .sidebar-backdrop {
        display: block;
      }

      body.sidebar-open .sidebar-backdrop {
        opacity: 1;
        pointer-events: auto;
      }

      .main-view {
        grid-template-rows: 58px minmax(0, 1fr) auto;
      }

      .topbar {
        padding: 8px 10px;
      }

      .status-pill {
        display: none;
      }

      .thread-title span {
        display: none;
      }

      .chat-stage {
        padding: 10px 12px 4px;
      }

      .message {
        grid-template-columns: 30px minmax(0, 1fr);
        gap: 10px;
      }

      .avatar {
        width: 30px;
        height: 30px;
      }

      .message-body {
        font-size: 0.9rem;
      }

      .composer-wrap {
        padding: 8px 10px 12px;
      }

      .composer-meta {
        display: none;
      }
    }

    @media (max-width: 520px) {
      .topbar-actions .desktop-only {
        display: none;
      }

      .thread-title strong {
        max-width: 44vw;
      }

      .composer {
        padding: 8px;
      }

      .composer input {
        font-size: 0.92rem;
      }
    }
  </style>
</head>

<body>
  <div id="three-container"></div>
  <div class="scene-vignette"></div>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Chat history">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-mark"><i class="fas fa-bolt"></i></div>
          <div class="brand-copy">
            <strong>Fahxd_Core</strong>
            <span>AI workspace</span>
          </div>
        </div>
        <button class="icon-btn" id="closeSidebarBtn" title="Close menu" aria-label="Close menu">
          <i class="fas fa-xmark"></i>
        </button>
      </div>

      <button class="primary-action" id="newChatSidebarBtn">
        <i class="fas fa-plus"></i>
        <span>New chat</span>
      </button>

      <div class="sidebar-section">
        <div class="section-label">Today</div>
        <div class="history-list" id="historyList"></div>
      </div>

      <div class="sidebar-footer">
        <button class="utility-btn" id="downloadHistoryBtn">
          <i class="fas fa-download"></i>
          <span>Download history</span>
        </button>
        <button class="utility-btn" id="clearHistoryBtn">
          <i class="fas fa-trash-can"></i>
          <span>Clear history</span>
        </button>
      </div>
    </aside>

    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <main class="main-view">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn" id="menuBtn" title="Menu" aria-label="Menu">
            <i class="fas fa-bars"></i>
          </button>
          <div class="thread-title">
            <strong>Fahxd_Core </strong>
            <span id="messageCount">0 messages</span>
          </div>
        </div>

        <div class="topbar-actions">
          <div class="status-pill" id="apiStatus">
            <span class="status-dot"></span>
            <span>Checking</span>
          </div>
          <button class="icon-btn desktop-only" id="newChatTopBtn" title="New chat" aria-label="New chat">
            <i class="fas fa-pen-to-square"></i>
          </button>
          <button class="icon-btn voice-btn active" id="voiceToggleBtn" title="Voice replies on" aria-label="Voice replies on">
            <i class="fas fa-volume-up"></i>
          </button>
        </div>
      </header>

      <section class="chat-stage">
        <div class="chat-panel" id="chatPanel"></div>
      </section>

      <div class="composer-wrap">
        <form class="composer" id="composerForm">
          <div class="composer-row">
            <button class="icon-btn mic-btn" type="button" id="micBtn" title="Voice input" aria-label="Voice input">
              <i class="fas fa-microphone"></i>
            </button>
            <input type="text" id="chatInput" placeholder="Message Fahxd_Core..." autocomplete="off" autofocus />
            <button class="send-btn" type="submit" id="sendBtn" title="Send" aria-label="Send">
              <i class="fas fa-arrow-up"></i>
            </button>
          </div>
          <div class="composer-meta">
            <span></span>
            <span id="charCount">0 chars</span>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.126.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "https://unpkg.com/three@0.126.0/examples/jsm/controls/OrbitControls.js";

    const container = document.getElementById("three-container");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x080a0f);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0.5, 7);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enableZoom = true;
    controls.zoomSpeed = 0.7;
    controls.rotateSpeed = 0.65;
    controls.enablePan = false;
    controls.target.set(0, 0.2, 0);
    controls.maxPolarAngle = Math.PI / 2.15;
    controls.minPolarAngle = 0.2;

    const ambient = new THREE.AmbientLight(0x3b4057, 0.68);
    scene.add(ambient);

    const keyLight = new THREE.DirectionalLight(0xd9d2ff, 1.1);
    keyLight.position.set(2.5, 3, 4);
    keyLight.castShadow = true;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x7df5e8, 0.62);
    fillLight.position.set(-3, 1, 2);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0x8b7cf7, 0.88);
    rimLight.position.set(-1, 2, -5);
    scene.add(rimLight);

    const glowLight = new THREE.PointLight(0x20d0bf, 0.58, 10);
    glowLight.position.set(0.5, 1, 1.5);
    scene.add(glowLight);

    const coreMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x786df2,
      metalness: 0.18,
      roughness: 0.12,
      clearcoat: 0.86,
      clearcoatRoughness: 0.14,
      transparent: true,
      opacity: 0.92,
      emissive: 0x1d6864,
      emissiveIntensity: 0.16,
      envMapIntensity: 1.0
    });

    const coreMesh = new THREE.Mesh(new THREE.IcosahedronGeometry(1.18, 2), coreMaterial);
    coreMesh.castShadow = true;
    coreMesh.receiveShadow = true;
    coreMesh.position.y = 0.18;
    scene.add(coreMesh);

    const wireframeMesh = new THREE.Mesh(
      new THREE.IcosahedronGeometry(1.35, 1),
      new THREE.MeshPhysicalMaterial({
        color: 0x20d0bf,
        emissive: 0x176d66,
        emissiveIntensity: 0.22,
        wireframe: true,
        transparent: true,
        opacity: 0.26,
        roughness: 0.3,
        metalness: 0.12
      })
    );
    wireframeMesh.position.y = 0.18;
    scene.add(wireframeMesh);

    const ringGroup = new THREE.Group();
    ringGroup.position.y = 0.18;

    const ringMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xc1bcff,
      emissive: 0x294a9c,
      emissiveIntensity: 0.16,
      metalness: 0.7,
      roughness: 0.24,
      transparent: true,
      opacity: 0.28,
      side: THREE.DoubleSide
    });

    const ring1 = new THREE.Mesh(new THREE.TorusGeometry(1.9, 0.025, 32, 64), ringMaterial);
    ring1.rotation.x = Math.PI / 2;
    ring1.rotation.z = 0.3;
    ringGroup.add(ring1);

    const ring2 = new THREE.Mesh(new THREE.TorusGeometry(1.7, 0.02, 24, 64), ringMaterial);
    ring2.rotation.y = 0.8;
    ring2.rotation.x = 0.7;
    ringGroup.add(ring2);

    const ring3 = new THREE.Mesh(new THREE.TorusGeometry(2.05, 0.015, 24, 64), ringMaterial);
    ring3.rotation.y = -0.5;
    ring3.rotation.z = 0.9;
    ringGroup.add(ring3);
    scene.add(ringGroup);

    const particleCount = 780;
    const particleGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);
    const particleColor = new THREE.Color();

    for (let i = 0; i < particleCount; i++) {
      const r = 2.7 + Math.random() * 2.1;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos((Math.random() * 2) - 1);

      positions[i * 3] = Math.sin(phi) * Math.cos(theta) * r;
      positions[i * 3 + 1] = Math.sin(phi) * Math.sin(theta) * r * 0.58 + 0.2;
      positions[i * 3 + 2] = Math.cos(phi) * r;

      const hue = Math.random() > 0.5 ? 0.49 + Math.random() * 0.05 : 0.68 + Math.random() * 0.08;
      particleColor.setHSL(hue, 0.72, 0.62 + Math.random() * 0.26);
      colors[i * 3] = particleColor.r;
      colors[i * 3 + 1] = particleColor.g;
      colors[i * 3 + 2] = particleColor.b;
    }

    particleGeo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    particleGeo.setAttribute("color", new THREE.BufferAttribute(colors, 3));

    const particles = new THREE.Points(
      particleGeo,
      new THREE.PointsMaterial({
        size: 0.035,
        vertexColors: true,
        transparent: true,
        opacity: 0.72,
        blending: THREE.AdditiveBlending,
        sizeAttenuation: true
      })
    );
    scene.add(particles);

    function animate() {
      const elapsed = performance.now() / 1000;

      coreMesh.rotation.x = Math.sin(elapsed * 0.15) * 0.1;
      coreMesh.rotation.y += 0.0025;
      wireframeMesh.rotation.x = coreMesh.rotation.x;
      wireframeMesh.rotation.y = coreMesh.rotation.y;

      ringGroup.rotation.y += 0.0012;
      ringGroup.rotation.x = Math.sin(elapsed * 0.08) * 0.05;
      ringGroup.rotation.z += 0.0006;

      particles.rotation.y += 0.0002;
      particles.rotation.x = Math.sin(elapsed * 0.02) * 0.02;

      glowLight.position.x = Math.sin(elapsed * 0.5) * 0.8;
      glowLight.position.z = Math.cos(elapsed * 0.5) * 0.8;

      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const chatPanel = document.getElementById("chatPanel");
    const input = document.getElementById("chatInput");
    const composerForm = document.getElementById("composerForm");
    const sendBtn = document.getElementById("sendBtn");
    const micBtn = document.getElementById("micBtn");
    const menuBtn = document.getElementById("menuBtn");
    const closeSidebarBtn = document.getElementById("closeSidebarBtn");
    const sidebarBackdrop = document.getElementById("sidebarBackdrop");
    const newChatTopBtn = document.getElementById("newChatTopBtn");
    const newChatSidebarBtn = document.getElementById("newChatSidebarBtn");
    const clearHistoryBtn = document.getElementById("clearHistoryBtn");
    const downloadHistoryBtn = document.getElementById("downloadHistoryBtn");
    const historyList = document.getElementById("historyList");
    const messageCount = document.getElementById("messageCount");
    const apiStatus = document.getElementById("apiStatus");
    const voiceToggleBtn = document.getElementById("voiceToggleBtn");
    const charCount = document.getElementById("charCount");

    const API_BASE_URL = window.location.protocol === "file:" ? "http://localhost:3000" : window.location.origin;
    const HISTORY_KEY = "fahxd_chat_history";
    const VOICE_KEY = "fahxd_voice_replies";
    const SIDEBAR_KEY = "fahxd_sidebar_collapsed";
    const WELCOME_TEXT = "Welcome to Fahxd_Core. Ask me anything and I will keep it clear, direct, and useful.";

    let voiceRepliesEnabled = localStorage.getItem(VOICE_KEY) !== "off";
    let activeHistoryIndex = null;

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatMessageContent(content) {
      return escapeHtml(content)
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    }

    function loadHistory() {
      try {
        const raw = localStorage.getItem(HISTORY_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch {
        return [];
      }
    }

    function saveHistory(history) {
      try {
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
      } catch {
        // localStorage may be unavailable in private mode.
      }
    }

    function getMessageIcon(type) {
      if (type === "user") return "fa-user";
      if (type === "error") return "fa-triangle-exclamation";
      return "fa-bolt";
    }

    function addMessage(type, content, persist = true, historyIndex = null) {
      const msgDiv = document.createElement("div");
      msgDiv.className = `message ${type}`;
      if (historyIndex !== null) {
        msgDiv.dataset.historyIndex = String(historyIndex);
      }

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.innerHTML = `<i class="fas ${getMessageIcon(type)}"></i>`;

      const body = document.createElement("div");
      body.className = "message-body";

      if (type === "ai" && content === "typing") {
        body.innerHTML = `
          <div class="typing-indicator">
            <span></span><span></span><span></span>
          </div>
        `;
        msgDiv.id = "typing-indicator";
      } else {
        body.innerHTML = formatMessageContent(content);
      }

      msgDiv.appendChild(avatar);
      msgDiv.appendChild(body);
      chatPanel.appendChild(msgDiv);
      chatPanel.scrollTop = chatPanel.scrollHeight;

      if (persist && !(type === "ai" && content === "typing")) {
        const history = loadHistory();
        history.push({ type, content, createdAt: new Date().toISOString() });
        saveHistory(history);
        updateHistoryUI();
      }

      updateMessageCount();
      return msgDiv;
    }

    function renderHistory(history) {
      chatPanel.innerHTML = "";

      if (!history.length) {
        addMessage("ai", WELCOME_TEXT, false);
        updateHistoryUI();
        updateMessageCount();
        return;
      }

      history.forEach((entry, index) => addMessage(entry.type, entry.content, false, index));
      updateHistoryUI();
      updateMessageCount();
    }

    function updateMessageCount() {
      const count = loadHistory().length;
      messageCount.textContent = `${count} ${count === 1 ? "message" : "messages"}`;
    }

    function updateHistoryUI() {
      const history = loadHistory();
      const userMessages = history
        .map((entry, index) => ({ ...entry, index }))
        .filter(entry => entry.type === "user")
        .reverse()
        .slice(0, 30);

      historyList.innerHTML = "";

      if (!userMessages.length) {
        const empty = document.createElement("div");
        empty.className = "empty-history";
        empty.innerHTML = `
          <i class="fas fa-message"></i>
          <div class="history-text">
            <strong>No chats yet</strong>
            <span>Start a new one</span>
          </div>
        `;
        historyList.appendChild(empty);
        return;
      }

      userMessages.forEach((entry, position) => {
        const item = document.createElement("button");
        item.type = "button";
        item.className = "history-item";
        if (entry.index === activeHistoryIndex) item.classList.add("active");

        const preview = entry.content.length > 42
          ? `${entry.content.slice(0, 42)}...`
          : entry.content;

        item.innerHTML = `
          <i class="fas fa-message"></i>
          <div class="history-text">
            <strong>${escapeHtml(preview)}</strong>
            <span>Chat ${userMessages.length - position}</span>
          </div>
        `;

        item.addEventListener("click", () => {
          activeHistoryIndex = entry.index;
          updateHistoryUI();
          const target = chatPanel.querySelector(`[data-history-index="${entry.index}"]`);
          if (target) {
            target.scrollIntoView({ behavior: "smooth", block: "center" });
          }
          closeSidebarOnMobile();
        });

        historyList.appendChild(item);
      });
    }

    function removeTypingIndicator() {
      const typing = document.getElementById("typing-indicator");
      if (typing) typing.remove();
    }

    function setApiStatus(text, isError = false) {
      apiStatus.classList.toggle("error", isError);
      apiStatus.innerHTML = `<span class="status-dot"></span><span>${escapeHtml(text)}</span>`;
    }

    async function refreshApiStatus() {
      try {
        const response = await fetch(`${API_BASE_URL}/api/health`);
        const data = await response.json();
        if (data.hasApiKey && data.sdkLoaded) {
          setApiStatus("Groq online");
        } else {
          setApiStatus("Server ready", false);
        }
      } catch {
        setApiStatus("Server offline", true);
      }
    }

    async function callGroq({ prompt }) {
      let response;

      try {
        response = await fetch(`${API_BASE_URL}/api/groq`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ prompt })
        });
      } catch {
        throw new Error(`Could not reach the local AI server at ${API_BASE_URL}`);
      }

      if (!response.ok) {
        const errorData = await response.json().catch(() => ({}));
        throw new Error(errorData.error || `API request failed with status ${response.status}`);
      }

      const data = await response.json();
      return data.reply || "";
    }

    function getFallbackReply(message, errorMessage = "") {
      const text = message.toLowerCase();

      if (text.includes("hello") || text.includes("hi")) {
        return "Hello! I am Fahxd_Core and I am ready to help.";
      }

      if (text.includes("name")) {
        return "I am Fahxd_Core, your immersive AI assistant.";
      }

      if (text.includes("what can you do") || text.includes("help")) {
        return "I can answer questions, help with ideas, and chat with you in real time.";
      }

      if (text.includes("code") || text.includes("html") || text.includes("javascript")) {
        return "I can help with coding questions, debugging, and simple implementation ideas.";
      }

      const detail = errorMessage ? `\n\nLive API note: ${errorMessage}` : "";
      return `Thanks for asking: "${message}". I am replying from fallback mode so the chat stays active.${detail}`;
    }

    function getSpeechText(content) {
      return String(content || "")
        .replace(/\[(.*?)\]\((.*?)\)/g, "$1")
        .replace(/```[\s\S]*?```/g, " ")
        .replace(/`([^`]+)`/g, "$1")
        .replace(/\*\*([^*]+)\*\*/g, "$1")
        .replace(/[*_#>~]/g, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function updateVoiceButton() {
      voiceToggleBtn.classList.toggle("active", voiceRepliesEnabled);
      voiceToggleBtn.title = voiceRepliesEnabled ? "Voice replies on" : "Voice replies off";
      voiceToggleBtn.setAttribute("aria-label", voiceToggleBtn.title);
      voiceToggleBtn.innerHTML = voiceRepliesEnabled
        ? '<i class="fas fa-volume-up"></i>'
        : '<i class="fas fa-volume-mute"></i>';
    }

    function speakReply(text) {
      const speechText = getSpeechText(text);
      if (!voiceRepliesEnabled || !speechText || !("speechSynthesis" in window)) return;

      const utterance = new SpeechSynthesisUtterance(speechText);
      utterance.lang = /[\u0900-\u097F]/.test(speechText) ? "hi-IN" : "en-IN";
      utterance.rate = 1;
      utterance.pitch = 1;

      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utterance);
    }

    function stopSpeech() {
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
    }

    async function sendMessage() {
      const msg = input.value.trim();
      if (!msg) return;

      stopSpeech();
      addMessage("user", msg);
      input.value = "";
      charCount.textContent = "0 chars";
      input.disabled = true;
      sendBtn.disabled = true;

      addMessage("ai", "typing", false);

      try {
        const reply = await callGroq({ prompt: msg });
        removeTypingIndicator();

        if (!reply) {
          throw new Error("Groq returned an empty response");
        }

        setApiStatus("Groq online");
        addMessage("ai", reply);
        speakReply(reply);
      } catch (error) {
        removeTypingIndicator();
        console.error("Full Error:", error);
        setApiStatus("Fallback mode", true);
        const fallbackReply = getFallbackReply(msg, error?.message || "Unknown error");
        addMessage("ai", fallbackReply);
        speakReply(fallbackReply);
      }

      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
    }

    function clearChatHistory() {
      if (!confirm("Clear the entire chat history? This cannot be undone.")) return;
      saveHistory([]);
      activeHistoryIndex = null;
      stopSpeech();
      renderHistory([]);
    }

    function newChat() {
      saveHistory([]);
      activeHistoryIndex = null;
      stopSpeech();
      renderHistory([]);
      input.value = "";
      input.focus();
      closeSidebarOnMobile();
    }

    function downloadChatHistory() {
      const history = loadHistory();
      if (!history.length) {
        alert("No chat history to download.");
        return;
      }

      const lines = ["FAHXD_CORE CHAT HISTORY", `Exported: ${new Date().toLocaleString()}`, ""];
      history.forEach((entry, index) => {
        const sender = entry.type === "user" ? "YOU" : "FAHXD_CORE";
        lines.push(`[${index + 1}] ${sender}`);
        lines.push(entry.content);
        lines.push("");
      });

      const blob = new Blob([lines.join("\n")], { type: "text/plain" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `fahxd-chat-${Date.now()}.txt`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    function openSidebar() {
      document.body.classList.add("sidebar-open");
      document.body.classList.remove("sidebar-collapsed");
      localStorage.setItem(SIDEBAR_KEY, "open");
    }

    function closeSidebarOnMobile() {
      if (window.innerWidth <= 860) {
        document.body.classList.remove("sidebar-open");
      }
    }

    function toggleSidebar() {
      if (window.innerWidth <= 860) {
        document.body.classList.toggle("sidebar-open");
        return;
      }

      document.body.classList.toggle("sidebar-collapsed");
      localStorage.setItem(
        SIDEBAR_KEY,
        document.body.classList.contains("sidebar-collapsed") ? "collapsed" : "open"
      );
    }

    composerForm.addEventListener("submit", (event) => {
      event.preventDefault();
      sendMessage();
    });

    input.addEventListener("input", () => {
      const count = input.value.length;
      charCount.textContent = `${count} ${count === 1 ? "char" : "chars"}`;
    });

    menuBtn.addEventListener("click", toggleSidebar);
    closeSidebarBtn.addEventListener("click", () => {
      if (window.innerWidth <= 860) {
        document.body.classList.remove("sidebar-open");
      } else {
        document.body.classList.add("sidebar-collapsed");
        localStorage.setItem(SIDEBAR_KEY, "collapsed");
      }
    });
    sidebarBackdrop.addEventListener("click", () => document.body.classList.remove("sidebar-open"));
    newChatTopBtn.addEventListener("click", newChat);
    newChatSidebarBtn.addEventListener("click", newChat);
    clearHistoryBtn.addEventListener("click", clearChatHistory);
    downloadHistoryBtn.addEventListener("click", downloadChatHistory);

    voiceToggleBtn.addEventListener("click", () => {
      voiceRepliesEnabled = !voiceRepliesEnabled;
      localStorage.setItem(VOICE_KEY, voiceRepliesEnabled ? "on" : "off");
      if (!voiceRepliesEnabled) stopSpeech();
      updateVoiceButton();
    });

    const SpeechRecognitionImpl = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isRecording = false;

    if (SpeechRecognitionImpl) {
      recognition = new SpeechRecognitionImpl();
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.lang = "en-IN";

      recognition.addEventListener("start", () => {
        isRecording = true;
        micBtn.classList.add("recording");
        micBtn.innerHTML = '<i class="fas fa-stop"></i>';
        input.placeholder = "Listening...";
      });

      recognition.addEventListener("result", (event) => {
        let transcript = "";
        for (let i = 0; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }
        input.value = transcript;
        charCount.textContent = `${input.value.length} chars`;

        if (event.results[event.results.length - 1].isFinal) {
          recognition.stop();
        }
      });

      recognition.addEventListener("error", (event) => {
        console.error("Speech recognition error:", event.error);
        setApiStatus(`Mic error: ${event.error}`, true);
      });

      recognition.addEventListener("end", () => {
        isRecording = false;
        micBtn.classList.remove("recording");
        micBtn.innerHTML = '<i class="fas fa-microphone"></i>';
        input.placeholder = "Message Fahxd_Core...";

        if (input.value.trim()) {
          sendMessage();
        }
      });

      micBtn.addEventListener("click", () => {
        if (isRecording) {
          recognition.stop();
        } else {
          input.value = "";
          charCount.textContent = "0 chars";
          try {
            recognition.start();
          } catch (err) {
            console.error("Could not start recognition:", err);
          }
        }
      });
    } else {
      micBtn.disabled = true;
      micBtn.title = "Voice input not supported in this browser";
    }

    if (localStorage.getItem(SIDEBAR_KEY) === "collapsed" && window.innerWidth > 860) {
      document.body.classList.add("sidebar-collapsed");
    }

    window.addEventListener("resize", () => {
      if (window.innerWidth > 860) {
        document.body.classList.remove("sidebar-open");
      }
    });

    renderHistory(loadHistory());
    updateVoiceButton();
    refreshApiStatus();
    setTimeout(() => input.focus(), 400);
  </script>
</body>

</html>
